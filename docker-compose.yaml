#Servicios a instalar

services:
  # Apache + PHP
  proyecto1php:
    build:
      context: ./.docker
      dockerfile: Dockerfile
      args:
      -  USERNAME=${USUARIO:-app}
      -  USER_UID=${USUARIO_UID:-1000}
      -  USER_GID=${USUARIO_GID:-1000}
    container_name: containerphp
    env_file:
      - .env
    user: ${USUARIO:-app}:${USUARIO:-app}
    #www-data

    #Crear un volumen para almacenar mi página web
    volumes:
      - ./src:/var/www/html
      - ./.env:/var/www/html/.env
      - .docker/apache/apache.conf:/etc/apache2/sites-enabled/000-default.conf
      #- .docker/apache/apache2.conf:/etc/apache2/apache2.conf
      - .docker/php/php.ini:/usr/local/etc/php/php.ini
      - .docker/xdebug/debug.ini:/usr/local/etc/php/conf.d/debug.ini

    ports:
      - 8080:80
    expose:
      - 80
    networks:
      - proyecto1
    links:
      - mariadb
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mariadb:
    image: mariadb:latest
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - 3310:3306
    networks:
      - proyecto1
    environment:
      MARIADB_ROOT_PASSWORD: toor
      MARIADB_DATABASE: ${MARIADB_DBNAME:-proyecto}
      MARIADB_USER: ${MARIADB_USER:-usuario}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-password}
    command:
      --default-authentication-plugin=mysql_native_password

networks:
  proyecto1:
    name: proyecto1
    driver: bridge
volumes:
  mariadb_data: